<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stil.css">
    <title>Online prodavnica</title>
</head>
<body>

    <div class="container">
        <table id="articles">
            <thead>
                <tr>
                    <th>Redni broj</th>
                    <th>Naziv</th>
                    <th>Cena</th>
                </tr>
            </thead>
            <tbody id="articles-body">

            </tbody>
        </table>

        <form id="forma">
            <label for="naziv">Naziv:</label>
            <input type="text" id="naziv" name="naziv" required>

            <label for="cena">Cena:</label>
            <input type="number" id="cena" name="cena" required>

            <label for="opis">Opis:</label>
            <textarea id="opis" name="opis" required></textarea>
        </form>

        <button type="button" id="submitBtn">Kreiraj artikal</button>

        <div id="articleDetails">
        </div>
    </div>

    <script src="funksionalnosti.js"></script>
</body>
</html>
