<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Artikli</title>
</head>
<body>
    
    <h1>Artikli</h1>
    <hr>

    <table border="1">
        <thead>
            <tr>
                <th>Br</th>
                <th>Naziv</th>
                <th>Cena($)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Monitor</td>
                <td>165</td>
            </tr>
            <tr>
                <td>2</td>
                <td>TV</td>
                <td>650</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Miš</td>
                <td>20</td>
            </tr>
        </tbody>
    </table>

    <br><br>

    <form>
        <fieldset>
            <legend>Forma za dodavanje novog proizvoda</legend>
            
            <label for="novi-naziv">Naziv:</label>
            <input type="text" id="novi-naziv" name="naziv"><br><br>
            
            <label for="nova-cena">Cena:</label>
            <input type="number" id="nova-cena" name="cena" min="0"><br><br>
            
            <label for="novi-opis">Opis:</label>
            <input type="text" id="novi-opis" name="opis"><br><br>
            
            <button type="submit">Dodaj</button>
        </fieldset>
    </form>

    <br><br>

    <div id="detalji-proizvoda">
        <p><strong>Naziv:</strong> <span id="detalji-naziv">...</span></p>
        <p><strong>Cena:</strong> <span id="detalji-cena">...</span></p>
        <p><strong>Opis:</strong> <span id="detalji-opis">...</span></p>
    </div>
</body>
</html>
